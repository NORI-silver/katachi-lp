# PRごとに SEO を自動で確かめる（AGENTS.md の「SEO」）。公開リポジトリなのでお金はかかりません。
name: SEO check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成ファイルが元ファイルと合っているか（ガイド・sitemap・llms.txt・規約）
        run: |
          python3 tools/seo_pages.py .
          python3 tools/legal.py .
          rm -rf tools/__pycache__
          git diff --stat --exit-code || (echo "tools/ を直したら python3 tools/seo_pages.py . と python3 tools/legal.py . を実行して、生成ファイルもコミットしてください"; exit 1)
      - name: SEO のチェック
        run: python3 tools/seo_check.py .
