# マッチング精度の回帰テスト（Nori 2026-11-15「マッチング精度が命」）。
# 依頼176件をサイトの画面で流し、③に出る会社を「正解の基準」（tools/tests/match_cases.json）で採点して、
# 基準（tools/tests/match_baseline.json）より悪くなったら失敗にする。AI経由（API・MCP）の上位3社がサイトの★と違っても失敗。公開リポジトリなのでお金はかかりません。
name: Matching check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'data/companies.json'
      - 'data/products.json'
      - 'tools/template.html'
      - 'tools/*.py'
      - 'tools/tests/match_*'
      - 'api/**'
      - '.github/workflows/match-check.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/companies.json'
      - 'tools/tests/match_*'

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright を入れる
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: マッチング精度を確かめる
        run: |
          node api/build.mjs
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          PAR=6 NODE_PATH=/tmp/pw/node_modules node tools/tests/match_eval.js http://localhost:8765/ match_result.json --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-result
          path: match_result.json
          retention-days: 14
