# KATACHI API（api/、Cloudflare Workers）。PRでテスト、main に入ったら公開。
# 公開には リポジトリの Secrets に CLOUDFLARE_API_TOKEN（Workers の編集権限）と CLOUDFLARE_ACCOUNT_ID が要る。無ければテストだけ。
name: API

on:
  pull_request:
    paths: ['api/**', 'data/**', 'tools/template.html', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: ['api/**', 'data/**', 'tools/template.html', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: サイトの製品の当て方を取り出す
        run: node api/build.mjs
      - name: テスト
        run: node api/test/test.mjs > /dev/null && node api/test/test.mjs | tail -1
      - name: 公開（Cloudflare Workers）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN が無いので公開はしません"; exit 0; fi
          cd api && npx -y wrangler@4.162.0 deploy
