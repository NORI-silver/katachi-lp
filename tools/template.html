<title>KATACHI 試作版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 白地に藍の一色。主役は「工程ボード」。工程ごとに会社を1社ずつはめ込んでチームを組む。
   確からしさは形で示す：● 確認済み / ○ 公開情報 / ◌(破線) AI推定 / ┈(点線) 要確認 */
:root{
  --bg:#ffffff; --bg2:#f5f7fb; --panel:#ffffff; --panel2:#f2f5fb; --hover:#eef3fd;
  --line:rgba(16,28,58,.10); --line2:rgba(16,28,58,.18);
  --fg:#0d1424; --mute:#566176; --dim:#8b94a7;
  --ice:#2350c8; --ice-ink:#ffffff; --amber:#b06800; --mint:#13845b;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  --f-lat:"Space Grotesk","Zen Kaku Gothic New",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:var(--ice)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--f-jp);text-wrap:balance;line-height:1.3}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lat{font-family:var(--f-lat)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.muted{color:var(--mute)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand svg{flex:none}
.brand b{font-family:var(--f-lat);font-weight:700;letter-spacing:.28em;font-size:15px}
.nav .sp{flex:1}
.langs{display:inline-flex;border:1px solid var(--line2);border-radius:99px;padding:2px}
.langs button{height:28px;padding:0 11px;border-radius:99px;font-size:12px;color:var(--mute)}
.langs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.mtstat{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.mtstat i{width:7px;height:7px;border-radius:50%;background:var(--ice);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
.mtbtn{font-size:12px;color:var(--ice);border:1px solid color-mix(in srgb,var(--ice) 40%,transparent);border-radius:99px;padding:3px 10px}
.trbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;display:grid;gap:6px}
@media (max-width:720px){.tag{display:none}.mtstat span{display:none}}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute);border:1px solid var(--line2);border-radius:99px;padding:3px 10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line2);font-weight:500;font-size:14px;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--ice)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ice);color:var(--ice-ink);border-color:var(--ice);font-weight:600}
.btn.pri:hover{background:#1c42a8}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent}
.link{color:var(--ice);font-size:13px}
.link:hover{text-decoration:underline}

/* certainty marks */
.mk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);white-space:nowrap;line-height:1}
.mk i{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.mk.ok i{background:var(--mint)}
.mk.pub i{border:1.5px solid var(--ice)}
.mk.ai i{border:1.5px dashed var(--amber)}
.mk.ai{color:var(--amber)}
.mk.unk i{border:1.5px dotted var(--dim)}
.mk.demo i{background:repeating-linear-gradient(-45deg,var(--mute) 0 2px,transparent 2px 4px);border:1px solid var(--mute)}

/* ---------- HOME ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#field{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 22% 55%,var(--bg) 25%,transparent 75%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:clamp(56px,10vh,110px) clamp(48px,8vh,90px)}
.hero h1{font-weight:900;font-size:clamp(38px,6.6vw,84px);letter-spacing:-.01em;line-height:1.08;max-width:12em;background:linear-gradient(180deg,#0d1424 35%,#2f4a8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{max-width:36em;color:var(--mute);font-size:clamp(14px,1.5vw,16.5px);margin:22px 0 34px}
.composer{max-width:760px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line2);border-radius:20px;padding:6px;box-shadow:0 24px 60px -24px rgba(16,28,58,.28),0 2px 6px rgba(16,28,58,.05);backdrop-filter:blur(10px);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:color-mix(in srgb,var(--ice) 60%,transparent);box-shadow:0 24px 60px -24px rgba(16,28,58,.28),0 0 0 4px rgba(35,80,200,.12)}
.composer.drag{border-color:var(--ice);background:color-mix(in srgb,var(--panel2) 92%,transparent)}
.composer textarea{display:block;width:100%;min-height:96px;max-height:260px;resize:none;border:0;background:transparent;padding:18px 18px 8px;font-size:17px;line-height:1.65;outline:none}
.composer textarea::placeholder{color:var(--dim)}
.cbar{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;flex-wrap:wrap}
.cbar .sp{flex:1}
.pillset{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px}
.pillset button{height:30px;padding:0 11px;border-radius:7px;font-size:12.5px;color:var(--mute)}
.pillset button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.clip{height:34px;padding:0 12px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);border:1px dashed var(--line2)}
.clip:hover{color:var(--fg);border-color:var(--ice)}
.files{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px}
.files:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:5px 6px 5px 8px;font-size:12px;max-width:100%}
.fchip .k{font-family:var(--f-mono);font-size:10px;color:var(--ice-ink);background:var(--ice);border-radius:4px;padding:1px 5px}
.fchip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.fchip .m{color:var(--mute)}
.fchip button{color:var(--dim);font-size:15px;padding:0 4px}
.paste{display:none;padding:4px 12px 8px}
.paste.on{display:grid;gap:8px}
.paste textarea{min-height:64px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;resize:vertical;width:100%}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;max-width:760px}
.examples span{font-size:12px;color:var(--dim);margin-right:4px;align-self:center}
.ex{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:6px 14px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.ex:hover{color:var(--fg);border-color:var(--line2);background:var(--panel)}

.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.fig{padding:30px 0 30px 0;border-right:1px solid var(--line)}
.fig:last-child{border-right:0}
.fig+.fig{padding-left:28px}
.fig b{display:block;font-family:var(--f-lat);font-weight:500;font-size:clamp(30px,4vw,46px);letter-spacing:-.02em;line-height:1.1}
.fig span{color:var(--mute);font-size:13px}

.how{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;padding-block:72px}
.how h2{font-size:clamp(24px,3vw,34px);font-weight:900}
.how p.lead{color:var(--mute);margin:14px 0 0}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.flow li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;padding:18px 20px;background:var(--panel);border:1px solid var(--line)}
.flow li:first-child{border-radius:var(--r) var(--r) 0 0}
.flow li:last-child{border-radius:0 0 var(--r) var(--r)}
.flow .no{font-family:var(--f-mono);color:var(--ice);font-size:12px;padding-top:3px}
.flow h3{font-size:16px;font-weight:700}
.flow p{margin:2px 0 0;color:var(--mute);font-size:13.5px}

.trust{padding-block:0 88px}
.trust .box{border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px;background:linear-gradient(180deg,var(--panel),var(--bg2))}
.trust h2{font-size:22px;font-weight:900}
.trust p{color:var(--mute);margin:10px 0 0;font-size:14px}
.trust dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 18px;align-items:baseline}
.trust dt .mk{font-size:13px;color:var(--fg)}
.trust dd{margin:0;color:var(--mute);font-size:13.5px}

/* ---------- LOADING ---------- */
.build{min-height:70vh;display:grid;place-items:center;text-align:center;padding-block:60px}
.build h2{font-size:clamp(22px,3vw,30px);font-weight:900}
.build ol{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:10px;text-align:left}
.build li{color:var(--dim);display:flex;gap:10px;align-items:center;transition:color .3s}
.build li::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dim)}
.build li.on{color:var(--fg)}
.build li.on::before{background:var(--ice);border-color:var(--ice);box-shadow:0 0 12px var(--ice)}

/* ---------- RESULT ---------- */
.rhead{padding-block:26px 0;display:grid;gap:14px}
.rhead .back{font-size:13px;color:var(--mute);text-decoration:none}
.rhead .back:hover{color:var(--fg)}
.rhead h1{font-size:clamp(22px,2.8vw,32px);font-weight:900;max-width:30em}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--bg2)}
.notice{font-size:13px;color:var(--fg);border-left:2px solid var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;max-width:62em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto}
.tabs button{height:44px;padding:0 14px;color:var(--mute);font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ice)}
.tabs .sp{flex:1}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);white-space:nowrap;padding-left:10px}
.switch .tg{width:34px;height:20px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);position:relative;transition:background .2s}
.switch .tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.switch[aria-checked="true"] .tg{background:color-mix(in srgb,var(--ice) 30%,transparent)}
.switch[aria-checked="true"] .tg::after{transform:translateX(14px);background:var(--ice)}

.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.plan{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;transition:border-color .15s,background .15s;position:relative}
.plan:hover{border-color:var(--line2)}
.plan[aria-pressed="true"]{border-color:var(--ice);background:linear-gradient(180deg,color-mix(in srgb,var(--ice) 9%,var(--panel)),var(--panel))}
.plan .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan h3{font-size:15.5px;font-weight:700}
.plan .rec{font-size:10.5px;font-family:var(--f-mono);letter-spacing:.1em;color:var(--ice-ink);background:var(--ice);border-radius:4px;padding:1px 6px}
.plan p{margin:0;color:var(--mute);font-size:12.5px;line-height:1.55}
.plan .nums{display:flex;gap:18px;margin-top:4px}
.plan .nums b{font-family:var(--f-lat);font-size:22px;font-weight:500}
.plan .nums small{color:var(--mute);font-size:11px;margin-left:3px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;margin-top:20px;padding-bottom:120px;align-items:start}
.board{display:grid;gap:18px;min-width:0}
.phase h4{margin:0 0 8px;display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:400}
.phase h4::after{content:"";flex:1;height:1px;background:var(--line)}
.rows{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:minmax(150px,.85fr) minmax(0,1.4fr) 24px;gap:14px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);transition:border-color .15s,background .15s}
.prow:hover{background:var(--panel2)}
.prow[aria-current="true"]{border-color:var(--ice);background:var(--panel2)}
.prow .pn{display:grid;gap:2px;min-width:0}
.prow .pn b{font-weight:600;font-size:14.5px}
.prow .pn small{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.prow .warn{color:var(--amber);font-size:11.5px}
.who{display:grid;grid-template-columns:34px minmax(0,1fr) 72px;gap:10px;align-items:center;min-width:0}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:14px;color:#0d1424}
.who .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sub{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--mute);overflow:hidden;white-space:nowrap}
.meter{display:grid;gap:4px;justify-items:end}
.meter b{font-family:var(--f-lat);font-weight:500;font-size:16px;color:var(--amber);line-height:1}
.meter .bar{width:72px;height:4px;border-radius:2px;background:var(--bg2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--amber) 50%,transparent),var(--amber))}
.prow .chev{color:var(--dim)}
.prow.gap .who{color:var(--amber);font-size:13px;display:block}
.excl{border:1px dashed color-mix(in srgb,var(--amber) 50%,transparent);border-radius:12px;padding:14px;font-size:13px;display:grid;gap:4px;color:var(--mute)}
.excl b{color:var(--fg)}

.insp{position:sticky;top:76px;background:var(--panel);box-shadow:0 12px 40px -18px rgba(16,28,58,.2);border:1px solid var(--line2);border-radius:18px;padding:20px;display:grid;gap:16px;max-height:calc(100vh - 96px);overflow:auto}
.insp h3{font-size:20px;font-weight:900}
.insp .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.aibox{border:1px dashed color-mix(in srgb,var(--amber) 55%,transparent);border-radius:12px;padding:12px 14px;font-size:13px;display:grid;gap:6px;background:color-mix(in srgb,var(--amber) 5%,transparent)}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border-radius:12px;border:1px solid var(--line);text-align:left;width:100%;background:var(--bg2)}
.opt:hover{border-color:var(--line2)}
.opt[aria-checked="true"]{border-color:var(--ice);background:color-mix(in srgb,var(--ice) 7%,var(--bg2))}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);margin-top:3px;position:relative}
.opt[aria-checked="true"] .rd{border-color:var(--ice)}
.opt[aria-checked="true"] .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ice)}
.opt .nm{font-size:13.5px;font-weight:600;line-height:1.4}
.opt .sub{font-size:11.5px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.opt .why{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.opt .score{font-family:var(--f-lat);font-size:18px;color:var(--amber);line-height:1}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.facts div{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;display:grid;gap:1px;min-width:0}
.facts span{font-size:10.5px;color:var(--dim)}
.facts b{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts b.q{color:var(--dim);font-weight:400}
.ho{font-size:12.5px;color:var(--mute);display:grid;gap:6px;margin:0;padding:0;list-style:none}
.ho li{padding:8px 10px;border-radius:9px;background:var(--bg2)}
.ho b{color:var(--fg);font-weight:500}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line2)}
.dock .wrap{display:flex;align-items:center;gap:14px;height:68px}
.dock .sum{display:flex;gap:22px;align-items:baseline;min-width:0;white-space:nowrap}
.dock .sum b{font-family:var(--f-lat);font-size:20px;font-weight:500}
.dock .sum span{font-size:12px;color:var(--mute);margin-left:4px}
.dock .sp{flex:1}

/* table */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:22px;background:var(--panel)}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:13px}
.cmp th,.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{background:var(--panel2);font-weight:600;min-width:170px;position:sticky;top:0}
.cmp tbody th{color:var(--mute);font-weight:500;white-space:nowrap;position:sticky;left:0;background:var(--panel);font-size:12.5px;z-index:1}
.cmp td.best{background:color-mix(in srgb,var(--mint) 10%,transparent);box-shadow:inset 2px 0 0 var(--mint)}
.cmp .q{color:var(--dim)}

/* plan tab */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px;padding-bottom:120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;align-content:start}
.card h3{font-size:16px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card ul{margin:0;padding-left:18px;color:var(--mute);font-size:13.5px;display:grid;gap:6px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;color:var(--mute)}
.form input,.form textarea,.form select{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--fg);font-size:14px}

const kindOf=n=>(KINDS.find(k=>k[0].test(n))||[0,'FILE'])[1];
function stlDims(buf){try{const dv=new DataView(buf);const n=buf.byteLength>=84?dv.getUint32(80,true):0;let pts=[];
  if(buf.byteLength===84+n*50){for(let i=0;i<n;i++){const o=84+i*50+12;for(let v=0;v<3;v++)pts.push([0,4,8].map(d=>dv.getFloat32(o+v*12+d,true)))}}
  else{const t=new TextDecoder().decode(buf);pts=[...t.matchAll(/vertex\s+(\S+)\s+(\S+)\s+(\S+)/g)].map(x=>[+x[1],+x[2],+x[3]])}
  if(!pts.length)return null;const d=[0,1,2].map(a=>Math.max(...pts.map(p=>p[a]))-Math.min(...pts.map(p=>p[a])));return d.map(x=>x.toFixed(0)).join('×')+'mm'}catch(e){return null}}
const sumText=t=>t.split(/\r?\n/).map(l=>l.replace(/^[#>*\-\s]+/,'').trim()).filter(l=>l.length>4).slice(0,6).join(' ').slice(0,260);

  renderFiles();
}

let raf=0;
function field(){
  cancelAnimationFrame(raf);const c=$('#field');if(!c)return;const x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr=Math.min(devicePixelRatio||1,2);let W,H;
  const size=()=>{W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};size();addEventListener('resize',size,{passive:true});
  const pts=[];for(let i=0;i<340;i++){const u=Math.acos(1-2*(i+.5)/340),v=Math.PI*(1+Math.sqrt(5))*i;pts.push([Math.sin(u)*Math.cos(v),Math.cos(u)*.82,Math.sin(u)*Math.sin(v)])}
  const fac=Array.from({length:26},(_,i)=>{const a=i/26*Math.PI*2+Math.sin(i*7)*.3,r=1.75+((i*37)%10)/14;return{a,r,y:((i*53)%20)/20-.5,ph:i*.7}});
  let t=0;
  const draw=()=>{
    x.clearRect(0,0,W,H);const cx=W>900?W*.73:W*.5,cy=W>900?H*.48:H*.3,R=Math.min(W>900?W*.17:W*.38,H*.34);
    const rot=t*.0016,cr=Math.cos(rot),sr=Math.sin(rot);

    prj.forEach((p,i)=>{const on=(Math.sin(t*.01+fac[i].ph)+1)/2;

function analyzeText(text){
  const t=String(text||'').toLowerCase(),C=GDB.caps;
  const leaf=c=>!C.some(o=>o.startsWith(c+'.'));
  let hit=[];C.forEach((c,i)=>{if(leaf(c)&&GDB.kw[i].some(k=>t.includes(k.toLowerCase())))hit.push(c)});
  const notices=[];
  for(const c of Object.keys(GDB.deferred||{}))if(hit.includes(c)){hit=hit.filter(x=>x!==c);notices.push(GDB.deferred[c])}
  for(const [kws,msg] of GDB.deferred_kw||[])if(kws.some(k=>t.includes(k.toLowerCase())))notices.push(msg);
  const hw=hit.some(c=>/^(sensing|electronics)/.test(c));
  if(!hw)hit=hit.filter(c=>c!=='testing.animal_trial');
  if(hw)for(const c of ['electronics.pcb_design','electronics.firmware','electronics.low_power','mechanical.enclosure_design','manufacturing.rapid_proto','electronics.pcba','manufacturing.assembly'])if(!hit.includes(c))hit.push(c);
  if(hit.includes('electronics.wireless')&&!hit.includes('testing.radio_cert'))hit.push('testing.radio_cert');
  if(hit.includes('electronics.low_power')&&!hit.includes('testing.battery_safety'))hit.push('testing.battery_safety');
  // 試作・設計・製造・試験の順に並べる
  const order=['sensing','electronics','mechanical','software','manufacturing','apparel','crafts','packaging','food','cosmetics','testing'];
  hit.sort((a,b)=>order.indexOf(a.split('.')[0])-order.indexOf(b.split('.')[0]));
  const regs=(GDB.regs||[]).filter(([kws])=>kws.some(k=>t.includes(k.toLowerCase()))).map(x=>x[1]);
  return {codes:hit,regs,notices:[...new Set(notices)]};
}
function rankFor(codes,opts){const idx=codes.map(c=>GDB.caps.indexOf(c)).filter(i=>i>=0);const qmax=opts.qmax||1e9;const out=[];
  for(const r of GDB.c){const[n,ct,pref,city,web,caps,proto,nodraw,ml,mat,lv]=r;if(!caps.some(i=>idx.includes(i)))continue;
    if(S.gf.area&&(S.gf.area==='JP'?ct!=='JP':S.gf.area==='ABROAD'?ct==='JP':(ct==='JP'?pref!==S.gf.area:ct!==S.gf.area)))continue;
    if(S.gf.proto&&!proto)continue;
    const s=(lv==='pub'?3:0)+(proto&&qmax<=10?1.5:0)+(nodraw?1:0)+(ml!=null&&ml<=qmax?1:0)-(ml!=null&&ml>qmax?3:0)+(ct==='JP'?2:0)+(opts.bonus?opts.bonus(r):0);
    out.push([s,r])}
  return out.sort((a,b)=>b[0]-a[0]).map(x=>x[1])}

function mtUI(){const el=$('#mt');if(!el)return;

  el.innerHTML=pending.size&&!explicit?'<button class="mtbtn" id="mtGo">'+(LANG==='en'?'Translate all':'全部翻译')+'</button>':'';

let mtT=0;
function scheduleMT(){mtUI();if(LANG==='ja'||mtOff||!explicit||!pending.size||mtBusy)return;clearTimeout(mtT);mtT=setTimeout(runMT,250)}
async function runMT(){
  if(sampleFn===undefined||!sampleFn){mtUI();return}
  const lang=LANG;const batch=[...pending].filter(s=>!MT[lang][s]).slice(0,40);pending=new Set([...pending].filter(s=>!batch.includes(s)));

    const out=await sampleFn.json(`Translate each Japanese string below into ${lang==='en'?'natural English':'Simplified Chinese'} for a manufacturing matchmaking website (users who want products made, and factories). Keep company names, product names, model numbers, URLs and units unchanged. Keep it concise. Reply with only a JSON object whose keys are the input strings exactly as given and whose values are the translations.\n\n`+JSON.stringify(batch),{modelTier:'quick'});

function setLang(l,byUser){LANG=l;if(byUser){explicit=true;try{localStorage.setItem('katachi-lang',JSON.stringify({lang:l}))}catch(e){}}

(async()=>{try{sampleFn=window.claude?await window.claude.use('sample'):null}catch(e){sampleFn=null}scheduleMT()})();
