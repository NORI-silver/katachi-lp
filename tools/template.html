<title>KATACHI 試作版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 白地に藍の一色。主役は「工程ボード」。工程ごとに会社を1社ずつはめ込んでチームを組む。
   確からしさは形で示す：● 確認済み / ○ 公開情報 / ◌(破線) AI推定 / ┈(点線) 要確認 */
:root{
  --bg:#ffffff; --bg2:#f5f7fb; --panel:#ffffff; --panel2:#f2f5fb; --hover:#eef3fd;
  --line:rgba(16,28,58,.10); --line2:rgba(16,28,58,.18);
  --fg:#0d1424; --mute:#566176; --dim:#8b94a7;
  --ice:#2350c8; --ice-ink:#ffffff; --amber:#b06800; --mint:#13845b;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  --f-lat:"Space Grotesk","Zen Kaku Gothic New",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:var(--ice)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--f-jp);text-wrap:balance;line-height:1.3}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lat{font-family:var(--f-lat)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.muted{color:var(--mute)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand svg{flex:none}
.brand b{font-family:var(--f-lat);font-weight:700;letter-spacing:.28em;font-size:15px}
.nav .sp{flex:1}
.langs{display:inline-flex;border:1px solid var(--line2);border-radius:99px;padding:2px}
.langs button{height:28px;padding:0 11px;border-radius:99px;font-size:12px;color:var(--mute)}
.langs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.mtstat{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.mtstat i{width:7px;height:7px;border-radius:50%;background:var(--ice);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
.mtbtn{font-size:12px;color:var(--ice);border:1px solid color-mix(in srgb,var(--ice) 40%,transparent);border-radius:99px;padding:3px 10px}
.trbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;display:grid;gap:6px}
@media (max-width:720px){.tag{display:none}.mtstat span{display:none}}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute);border:1px solid var(--line2);border-radius:99px;padding:3px 10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line2);font-weight:500;font-size:14px;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--ice)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ice);color:var(--ice-ink);border-color:var(--ice);font-weight:600}
.btn.pri:hover{background:#1c42a8}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent}
.link{color:var(--ice);font-size:13px}
.link:hover{text-decoration:underline}

/* certainty marks */
.mk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);white-space:nowrap;line-height:1}
.mk i{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.mk.ok i{background:var(--mint)}
.mk.pub i{border:1.5px solid var(--ice)}
.mk.ai i{border:1.5px dashed var(--amber)}
.mk.ai{color:var(--amber)}
.mk.unk i{border:1.5px dotted var(--dim)}
.mk.demo i{background:repeating-linear-gradient(-45deg,var(--mute) 0 2px,transparent 2px 4px);border:1px solid var(--mute)}

/* ---------- HOME ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#field{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 22% 55%,var(--bg) 25%,transparent 75%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:clamp(56px,10vh,110px) clamp(48px,8vh,90px)}
.hero h1{font-weight:900;font-size:clamp(38px,6.6vw,84px);letter-spacing:-.01em;line-height:1.08;max-width:12em;background:linear-gradient(180deg,#0d1424 35%,#2f4a8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{max-width:36em;color:var(--mute);font-size:clamp(14px,1.5vw,16.5px);margin:22px 0 34px}
.composer{max-width:760px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line2);border-radius:20px;padding:6px;box-shadow:0 24px 60px -24px rgba(16,28,58,.28),0 2px 6px rgba(16,28,58,.05);backdrop-filter:blur(10px);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:color-mix(in srgb,var(--ice) 60%,transparent);box-shadow:0 24px 60px -24px rgba(16,28,58,.28),0 0 0 4px rgba(35,80,200,.12)}
.composer.drag{border-color:var(--ice);background:color-mix(in srgb,var(--panel2) 92%,transparent)}
.composer textarea{display:block;width:100%;min-height:96px;max-height:260px;resize:none;border:0;background:transparent;padding:18px 18px 8px;font-size:17px;line-height:1.65;outline:none}
.composer textarea::placeholder{color:var(--dim)}
.cbar{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;flex-wrap:wrap}
.cbar .sp{flex:1}
.cbar>.btn.pri{margin-left:auto}
.pillset{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px}
.pillset button{height:30px;padding:0 11px;border-radius:7px;font-size:12.5px;color:var(--mute)}
.pillset button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.clip{height:34px;padding:0 12px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);border:1px dashed var(--line2)}
.clip:hover{color:var(--fg);border-color:var(--ice)}
.files{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px}
.files:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:5px 6px 5px 8px;font-size:12px;max-width:100%}
.fchip .k{font-family:var(--f-mono);font-size:10px;color:var(--ice-ink);background:var(--ice);border-radius:4px;padding:1px 5px}
.fchip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.fchip .m{color:var(--mute)}
.fchip button{color:var(--dim);font-size:15px;padding:0 4px}
.paste{display:none;padding:4px 12px 8px}
.paste.on{display:grid;gap:8px}
.refp{display:none;padding:6px 12px 10px;gap:10px}.refp.on{display:grid}
.refp>*{min-width:0}.refp h4{margin:0;font-size:14px}.refp label{display:grid;gap:4px;font-size:12.5px;color:var(--mute)}
.refp input,.refp textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;color:var(--fg);background:#fff}
.refp textarea{min-height:64px;resize:vertical}
.rchips{display:flex;flex-wrap:wrap;gap:6px}.rchips button{font-size:12.5px;padding:6px 11px;border:1px solid var(--line2);border-radius:99px;background:#fff;color:var(--fg)}
.rchips button[aria-pressed="true"]{border-color:var(--ice);background:var(--hover);color:var(--ice);box-shadow:inset 0 0 0 1px var(--ice)}
.refwarn{font-size:12px;color:#8a5300;background:#fff7e6;border:1px solid #f3d39b;border-radius:10px;padding:8px 10px}
.referr{font-size:12.5px;color:#b42318;display:none}.referr.on{display:block}
.refrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media(max-width:480px){.refrow{grid-template-columns:1fr}}
.clip.ref{border-style:solid}
.paste textarea{min-height:64px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;resize:vertical;width:100%}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;max-width:760px}
.examples span{font-size:12px;color:var(--dim);margin-right:4px;align-self:center}
.ex{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:6px 14px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.ex:hover{color:var(--fg);border-color:var(--line2);background:var(--panel)}
.aihome{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;max-width:760px}
.aihome>span{font-size:12px;color:var(--dim);margin-right:4px}
.aihome a{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ice);border:1px solid color-mix(in srgb,var(--ice) 35%,transparent);border-radius:99px;padding:6px 14px;text-decoration:none;background:#fff}
.aihome a:hover{background:var(--hover)}.aihome a svg{width:14px;height:14px}

.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.fig{padding:30px 0 30px 0;border-right:1px solid var(--line)}
.fig:last-child{border-right:0}
.fig+.fig{padding-left:28px}
.fig b{display:block;font-family:var(--f-lat);font-weight:500;font-size:clamp(30px,4vw,46px);letter-spacing:-.02em;line-height:1.1}
.fig span{color:var(--mute);font-size:13px}

.how{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;padding-block:72px}
.how h2{font-size:clamp(24px,3vw,34px);font-weight:900}
.how p.lead{color:var(--mute);margin:14px 0 0}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.flow li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;padding:18px 20px;background:var(--panel);border:1px solid var(--line)}
.flow li:first-child{border-radius:var(--r) var(--r) 0 0}
.flow li:last-child{border-radius:0 0 var(--r) var(--r)}
.flow .no{font-family:var(--f-mono);color:var(--ice);font-size:12px;padding-top:3px}
.flow h3{font-size:16px;font-weight:700}
.flow p{margin:2px 0 0;color:var(--mute);font-size:13.5px}

.trust{padding-block:0 88px}
.trust .box{border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px;background:linear-gradient(180deg,var(--panel),var(--bg2))}
.trust h2{font-size:22px;font-weight:900}
.trust p{color:var(--mute);margin:10px 0 0;font-size:14px}
.trust dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 18px;align-items:baseline}
.trust dt .mk{font-size:13px;color:var(--fg)}
.trust dd{margin:0;color:var(--mute);font-size:13.5px}

/* ---------- LOADING ---------- */
.build{min-height:70vh;display:grid;place-items:center;text-align:center;padding-block:60px}
.build h2{font-size:clamp(22px,3vw,30px);font-weight:900}
.build ol{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:10px;text-align:left}
.build li{color:var(--dim);display:flex;gap:10px;align-items:center;transition:color .3s}
.build li::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dim)}
.build li.on{color:var(--fg)}
.build li.on::before{background:var(--ice);border-color:var(--ice);box-shadow:0 0 12px var(--ice)}

/* ---------- RESULT ---------- */
.rhead{padding-block:26px 0;display:grid;gap:14px}
.rhead .back{font-size:13px;color:var(--mute);text-decoration:none}
.rhead .back:hover{color:var(--fg)}
.rhead h1{font-size:clamp(22px,2.8vw,32px);font-weight:900;max-width:30em}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--bg2)}
.notice{font-size:13px;color:var(--fg);border-left:2px solid var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;max-width:62em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto}
.tabs button{height:44px;padding:0 14px;color:var(--mute);font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ice)}
.tabs .sp{flex:1}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);white-space:nowrap;padding-left:10px}
.switch .tg{width:34px;height:20px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);position:relative;transition:background .2s}
.switch .tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.switch[aria-checked="true"] .tg{background:color-mix(in srgb,var(--ice) 30%,transparent)}
.switch[aria-checked="true"] .tg::after{transform:translateX(14px);background:var(--ice)}

.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.plan{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;transition:border-color .15s,background .15s;position:relative}
.plan:hover{border-color:var(--line2)}
.plan[aria-pressed="true"]{border-color:var(--ice);background:linear-gradient(180deg,color-mix(in srgb,var(--ice) 9%,var(--panel)),var(--panel))}
.plan .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan h3{font-size:15.5px;font-weight:700}
.plan .rec{font-size:10.5px;font-family:var(--f-mono);letter-spacing:.1em;color:var(--ice-ink);background:var(--ice);border-radius:4px;padding:1px 6px}
.plan p{margin:0;color:var(--mute);font-size:12.5px;line-height:1.55}
.plan .nums{display:flex;gap:18px;margin-top:4px}
.plan .nums b{font-family:var(--f-lat);font-size:22px;font-weight:500}
.plan .nums small{color:var(--mute);font-size:11px;margin-left:3px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;margin-top:20px;padding-bottom:120px;align-items:start}
.board{display:grid;gap:18px;min-width:0}
.phase h4{margin:0 0 8px;display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:400}
.phase h4::after{content:"";flex:1;height:1px;background:var(--line)}
.rows{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:minmax(150px,.85fr) minmax(0,1.4fr) 24px;gap:14px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);transition:border-color .15s,background .15s}
.prow:hover{background:var(--panel2)}
.prow[aria-current="true"]{border-color:var(--ice);background:var(--panel2)}
.prow .pn{display:grid;gap:2px;min-width:0}
.prow .pn b{font-weight:600;font-size:14.5px}
.prow .pn small{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.prow .warn{color:var(--amber);font-size:11.5px}
.who{display:grid;grid-template-columns:34px minmax(0,1fr) 72px;gap:10px;align-items:center;min-width:0}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:14px;color:#0d1424}
.who .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sub{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--mute);overflow:hidden;white-space:nowrap}
.meter{display:grid;gap:4px;justify-items:end}
.meter b{font-family:var(--f-lat);font-weight:500;font-size:16px;color:var(--amber);line-height:1}
.meter .bar{width:72px;height:4px;border-radius:2px;background:var(--bg2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--amber) 50%,transparent),var(--amber))}
.prow .chev{color:var(--dim)}
.prow.gap .who{color:var(--amber);font-size:13px;display:block}
.excl{border:1px dashed color-mix(in srgb,var(--amber) 50%,transparent);border-radius:12px;padding:14px;font-size:13px;display:grid;gap:4px;color:var(--mute)}
.excl b{color:var(--fg)}

.insp{position:sticky;top:76px;background:var(--panel);box-shadow:0 12px 40px -18px rgba(16,28,58,.2);border:1px solid var(--line2);border-radius:18px;padding:20px;display:grid;gap:16px;max-height:calc(100vh - 96px);overflow:auto}
.insp h3{font-size:20px;font-weight:900}
.insp .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.aibox{border:1px dashed color-mix(in srgb,var(--amber) 55%,transparent);border-radius:12px;padding:12px 14px;font-size:13px;display:grid;gap:6px;background:color-mix(in srgb,var(--amber) 5%,transparent)}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border-radius:12px;border:1px solid var(--line);text-align:left;width:100%;background:var(--bg2)}
.opt:hover{border-color:var(--line2)}
.opt[aria-checked="true"]{border-color:var(--ice);background:color-mix(in srgb,var(--ice) 7%,var(--bg2))}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);margin-top:3px;position:relative}
.opt[aria-checked="true"] .rd{border-color:var(--ice)}
.opt[aria-checked="true"] .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ice)}
.opt .nm{font-size:13.5px;font-weight:600;line-height:1.4}
.opt .sub{font-size:11.5px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.opt .why{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.opt .score{font-family:var(--f-lat);font-size:18px;color:var(--amber);line-height:1}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.facts div{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;display:grid;gap:1px;min-width:0}
.facts span{font-size:10.5px;color:var(--dim)}
.facts b{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts b.q{color:var(--dim);font-weight:400}
.ho{font-size:12.5px;color:var(--mute);display:grid;gap:6px;margin:0;padding:0;list-style:none}
.ho li{padding:8px 10px;border-radius:9px;background:var(--bg2)}
.ho b{color:var(--fg);font-weight:500}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line2)}
.dock .wrap{display:flex;align-items:center;gap:14px;height:68px}

<script>
(function(){
const D=window.KATACHI_DATA;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const capName=t=>String(t).replace(/「([a-z_.]+)」/g,(m,c)=>'「'+(D.cap[c]||c)+'」');
const fmt=n=>Number(n).toLocaleString('ja-JP');
const LV={official:['pub','公式サイトで確認','企業の公式サイトに書かれている情報'],news:['pub','報道で確認','ニュース・記事で確認できた情報'],listing:['pub','掲載ページで確認','企業自身の製品掲載ページの情報'],aggregator:['unk','未確認','まとめサイトに名前があるだけで、中身は未確認'],gov:['unk','国の登録情報のみ','出典「Gビズインフォ」(経済産業省)をもとにKATACHI作成。業種の登録情報だけで、受注条件は未確認'],demo:['demo','記入例（架空）','画面の見え方を示す架空データ']};
const mk=(k,t,title)=>`<span class="mk ${k}"${title?` title="${esc(title)}"`:''}><i></i>${esc(t)}</span>`;
const lv=c=>{const l=LV[c?.level]||LV.aggregator;return mk(l[0],l[1],l[2])};
const CTRY={CN:'中国',BD:'バングラデシュ',VN:'ベトナム',TW:'台湾',US:'アメリカ',EU:'欧州',HK:'香港',KR:'韓国',TH:'タイ',IN:'インド',DE:'ドイツ',MY:'マレーシア',ID:'インドネシア',PH:'フィリピン'};
const abroad=c=>c&&c.country&&c.country!=='JP'&&c.country!=='日本';
const place=c=>[abroad(c)?(CTRY[c.country]||c.country):null,c?.pref].filter(Boolean).join(' ')||'所在地 要確認';
const PHASE=[['sensing','測る'],['electronics','電子・回路'],['mechanical','形・構造'],['manufacturing','つくる'],['software','アプリ・ソフト'],['testing','試験・認証']];
const phaseOf=code=>{const p=PHASE.find(x=>code.startsWith(x[0]));return p?p[1]:'その他'};
const HUES=['#d6e2ff','#d3efe4','#e4dcff','#fbe5c4','#dcecff','#f6dbe7','#e2f1cf'];
const avatar=n=>{let h=0;for(const ch of n)h=(h*31+ch.codePointAt(0))>>>0;const nm=n.replace(/^(株式会社|有限会社|（架空）)/,'').trim();return `<span class="av" style="background:${HUES[h%HUES.length]}" aria-hidden="true">${esc(nm[0]||'?')}</span>`};
const MAT={factory:'工場が手配',customer:'支給のみ',both:'どちらも可'};
const matTxt=t=>MAT[t?.material_procurement]||null;
const conTxt=t=>{const v=t?.design_consultation;if(v===0)return '不可';if(v!==1)return null;return {paid:'可（有償）',free:'可（無料）',both:'可'}[t.consultation_fee]||'可'};
const yn=(t,k)=>t?.[k]===1?'可':t?.[k]===0?'不可':null;
const fact=(label,v)=>`<div><span>${label}</span><b class="${v?'':'q'}">${esc(v||'要確認')}</b></div>`;
const dlvLang=c=>!c||!abroad(c)?'日本語':['CN','TW','HK'].includes(c.country)?'中国語':'英語';
const lot=t=>t?.min_lot!=null?t.min_lot+'個〜':null;
const REGION=[['北海道・東北','北海道 青森県 岩手県 宮城県 秋田県 山形県 福島県'],['関東','茨城県 栃木県 群馬県 埼玉県 千葉県 東京都 神奈川県'],['中部','新潟県 富山県 石川県 福井県 山梨県 長野県 岐阜県 静岡県 愛知県'],['近畿','三重県 滋賀県 京都府 大阪府 兵庫県 奈良県 和歌山県'],['中国・四国','鳥取県 島根県 岡山県 広島県 山口県 徳島県 香川県 愛媛県 高知県'],['九州・沖縄','福岡県 佐賀県 長崎県 熊本県 大分県 宮崎県 鹿児島県 沖縄県']];
const F0={where:'all',region:'',proto:false,nodraw:false,mat:false,consult:false,lot:false,cert:false,verified:false,hideUnk:false,showNg:false,sort:'fit',cap:0};
const FCHIPS=[['proto','試作から対応'],['nodraw','図面なしで相談'],['mat','材料も手配'],['consult','試作・改良の相談'],['lot','小ロット可'],['cert','認証あり'],['verified','公開情報で確認済み']];
const fActive=()=>{const f=S.flt;return f.where!=='all'||f.region||FCHIPS.some(([k])=>f[k])||f.cap>0};
const b3=v=>v===1?'ok':v===0?'ng':'unk';
function fEval(name){const f=S.flt,co=D.companies[name];if(!co)return 'unk';const t=co.terms||{};const r=[];
  if(f.where==='jp')r.push(abroad(co)?'ng':'ok');if(f.where==='abroad')r.push(abroad(co)?'ok':(co.country||co.pref)?'ng':'unk');
  if(f.region){const g=REGION.find(x=>x[0]===f.region);r.push(abroad(co)?'ng':!co.pref?'unk':g[1].split(' ').includes(co.pref)?'ok':'ng')}
  if(f.proto)r.push(b3(t.accepts_prototype));if(f.nodraw)r.push(b3(t.accepts_no_drawing));if(f.consult)r.push(b3(t.design_consultation));
  if(f.mat)r.push(t.material_procurement==null?'unk':['factory','both'].includes(t.material_procurement)?'ok':'ng');
  if(f.lot){const lim={proto:10,small:500,mass:1e12}[S.qty];r.push(t.min_lot==null?'unk':t.min_lot<=lim?'ok':'ng')}
  if(f.cert)r.push((co.certs||[]).length?'ok':'unk');
  if(f.verified)r.push(['official','news','listing','demo'].includes(co.level)?'ok':'ng');
  if(f.cap&&demo())r.push(demoQ(name).price<=f.cap?'ok':'ng');
  return r.includes('ng')?'ng':r.includes('unk')?'unk':'ok'}
const fShow=n=>{const e=fEval(n);return e==='ok'||(e==='unk'&&!S.flt.hideUnk)||S.flt.showNg};
function fSort(list){const rk={ok:0,unk:1,ng:2};const k=S.flt.sort;const rv=n=>{const r=demoR(n);return r.length?ravg(r):0};
  return [...list].sort((a,b)=>(rk[fEval(a.company)]-rk[fEval(b.company)])||(k==='price'&&demo()?demoQ(a.company).price-demoQ(b.company).price:k==='lead'&&demo()?demoQ(a.company).lead-demoQ(b.company).lead:k==='review'&&demo()?rv(b.company)-rv(a.company):b.score-a.score))}
function fbar(){const f=S.flt;const all=[...new Set(R().per_requirement.flatMap(p=>p.candidates.map(c=>c.company)))];const cnt={ok:0,unk:0,ng:0};all.forEach(n=>cnt[fEval(n)]++);
  return `<div class="fbar" role="group" aria-label="会社を絞り込む"><span class="fl">絞り込み</span>
    <select id="fWhere" aria-label="所在地">${[['all','国内・海外すべて'],['jp','国内のみ'],['abroad','海外のみ']].map(([v,t])=>`<option value="${v}" ${f.where===v?'selected':''}>${t}</option>`).join('')}</select>
    <select id="fRegion" aria-label="地方"><option value="">地方を問わない</option>${REGION.map(([r])=>`<option value="${r}" ${f.region===r?'selected':''}>${r}</option>`).join('')}</select>
    ${FCHIPS.map(([k,t])=>`<button class="fchip" data-f="${k}" aria-pressed="${!!f[k]}">${t}</button>`).join('')}
    <select id="fCap" aria-label="見積の上限" ${demo()?'':'disabled title="見積が届くと使えます"'}>${[[0,'見積の上限なし'],[300000,'見積 30万円まで'],[500000,'見積 50万円まで'],[1000000,'見積 100万円まで']].map(([v,t])=>`<option value="${v}" ${+f.cap===v?'selected':''}>${t}</option>`).join('')}</select>
    <select id="fSort" aria-label="並べ替え">${[['fit','適合度が高い順'],['price','見積が安い順'],['lead','納期が短い順'],['review','口コミが良い順']].map(([v,t])=>`<option value="${v}" ${f.sort===v?'selected':''} ${v!=='fit'&&!demo()?'disabled':''}>${t}${v!=='fit'&&!demo()?'（見積後）':''}</option>`).join('')}</select>
    ${fActive()?`<div class="fsum"><span>条件に合う <b>${cnt.ok}</b>社</span><span>要確認 <b>${cnt.unk}</b>社</span><span>条件外 <b>${cnt.ng}</b>社</span>
      <label class="chk"><input type="checkbox" id="fHide" ${f.hideUnk?'checked':''}><span>要確認の会社を隠す</span></label>
      <button class="link" id="fClear">条件をクリア</button></div>`:`<div class="fsum"><span>受注条件の多くはまだ確認中です。絞り込むと、条件に合う会社が先に並び、要確認の会社は薄く表示されます。</span></div>`}
  </div>`}
function bindFbar(){const re=k=>{track('filter_company',{filter:k,active_filters:Object.keys(F0).filter(x=>!['hideUnk','showNg','sort'].includes(x)&&S.flt[x]&&S.flt[x]!=='all').length});tabTeam()};
  $('#fWhere').onchange=e=>{S.flt.where=e.target.value;re('where')};$('#fRegion').onchange=e=>{S.flt.region=e.target.value;re('region')};
  $('#fCap').onchange=e=>{S.flt.cap=+e.target.value;re('budget_cap')};$('#fSort').onchange=e=>{S.flt.sort=e.target.value;re('sort')};
  $$('[data-f]').forEach(b=>b.onclick=()=>{S.flt[b.dataset.f]=!S.flt[b.dataset.f];re(b.dataset.f)});
  $('#fHide')&&($('#fHide').onchange=e=>{S.flt.hideUnk=e.target.checked;re('hide_unknown')});
  $('#fClear')&&($('#fClear').onclick=()=>{S.flt=Object.assign({},F0,{sort:S.flt.sort});re('clear')})}

/* ---------- analytics (GA4) ----------
   測定IDを GA_IDS に入れるだけで動く。ペットサイトと同じく、サイト専用プロパティ＋総合プロパティの両方に送れる。
   claude.ai の試作版では外部スクリプトが読めないため、イベントは dataLayer に積むだけ（GAには届かない）。 */
const GA_IDS=[/* 'G-XXXXXXXXXX' (KATACHI専用), 'G-YYYYYYYYYY' (総合) */];
window.dataLayer=window.dataLayer||[];
function gtag(){window.dataLayer.push(arguments)}
(function(){const host=location.hostname;if(!GA_IDS.length||!host||/claude\.ai$|claudeusercontent\.com$|^localhost$/.test(host))return;
  const sc=document.createElement('script');sc.async=true;sc.src='https://www.googletagmanager.com/gtag/js?id='+GA_IDS[0];document.head.appendChild(sc);
  gtag('js',new Date());GA_IDS.forEach(id=>gtag('config',id,{send_page_view:false}))})();
function track(name,params){let lang='ja';try{lang=LANG}catch(e){}const p=Object.assign({site_lang:lang,dataset:S.scen==='demo'?'demo':'real'},params||{});
  try{gtag('event',name,p)}catch(e){}try{if(localStorage.getItem('katachi-ga-debug'))console.info('[GA]',name,p)}catch(e){}}
function pageview(path,title){track('page_view',{page_path:path,page_title:title})}

let S={scen:'collar',lastReal:'collar',plan:0,assign:{},custom:false,cur:null,tab:'team',qty:'small',drawing:false,idea:'',files:[],answers:{},matched:null,flt:null};S.flt=Object.assign({},F0);

/* demo-only quotes & reviews (fictional companies only) */
const hash=s=>{let h=7;for(const ch of s)h=(h*31+ch.codePointAt(0))>>>0;return h};
const demoQ=n=>{const h=hash(n);return{price:[18,24,35,42,55,68,80,120][h%8]*1e4,lead:[2,3,3,4,5,6][h%6]}};
const REV=[['初回の打ち合わせで、曖昧な説明から要件表を作ってくれた。試作2回目で狙い通りの形になった。','個人・ペット用品'],['見積は少し高めだったが、検査記録を写真付きで出してくれたので安心できた。','スタートアップ'],['納期は1週間遅れたが、事前に連絡があり理由の説明も丁寧だった。','個人・ハードウェア'],['小ロットでも嫌がらずに対応。図面がない状態から相談に乗ってもらえた。','個人・雑貨']];
const demoR=n=>{const h=hash(n);return Array.from({length:1+h%3},(_,i)=>({t:REV[(h+i)%4][0],who:REV[(h+i)%4][1],ax:[4+((h>>i)&1),4+((h>>(i+2))&1),3+((h>>(i+4))&1),4]}))};
const ravg=r=>+(r.reduce((a,x)=>a+x.ax.reduce((p,c)=>p+c,0)/4,0)/r.length).toFixed(1);

/* ---------- routing ---------- */
function route(){const h=location.hash.slice(1);if(h==='result'){renderResult();pageview('/result','チーム編成')}else if(h==='pick'){renderPick();pageview('/pick','候補の会社（選択式）')}else if(h==='match'){renderMatch();pageview('/match','2 イメージを確かめる')}else if(h==='co'){renderMatch();pageview('/companies','3 会社を選ぶ')}else{renderHome();pageview('/','トップ')}window.scrollTo(0,0)}
addEventListener('hashchange',route);

/* ---------- 4ステップ（書く→イメージを確かめる→会社を選ぶ→見積を依頼）。1画面に1つの目的、次に押すボタンは常に1つ ---------- */
const STEPS=['書く','イメージを確かめる','会社を選ぶ','見積を依頼'];
function stepBar(n){return `<nav class="stepbar" aria-label="進み具合"><ol>${STEPS.map((t,i)=>{const k=i+1,cls=k<n?'done':k===n?'on':'';const inner=`<b><i class="mono">${k}</i>${t}</b>`;
  return `<li class="${cls}"${k===n?' aria-current="step"':''}>${k<n?`<button type="button" data-stepgo="${k}">${inner}</button>`:`<span>${inner}</span>`}</li>`}).join('')}</ol></nav>`}

let raf=0;
function field(){
  cancelAnimationFrame(raf);const c=$('#field');if(!c)return;const x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr=Math.min(devicePixelRatio||1,2);let W,H;
  const size=()=>{W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};size();addEventListener('resize',size,{passive:true});
  const pts=[];for(let i=0;i<340;i++){const u=Math.acos(1-2*(i+.5)/340),v=Math.PI*(1+Math.sqrt(5))*i;pts.push([Math.sin(u)*Math.cos(v),Math.cos(u)*.82,Math.sin(u)*Math.sin(v)])}
  const fac=Array.from({length:26},(_,i)=>{const a=i/26*Math.PI*2+Math.sin(i*7)*.3,r=1.75+((i*37)%10)/14;return{a,r,y:((i*53)%20)/20-.5,ph:i*.7}});
  let t=0;
  const draw=()=>{
    x.clearRect(0,0,W,H);const cx=W>900?W*.73:W*.5,cy=W>900?H*.48:H*.3,R=Math.min(W>900?W*.17:W*.38,H*.34);
    const rot=t*.0016,cr=Math.cos(rot),sr=Math.sin(rot);
    const prj=fac.map(f=>{const a=f.a+rot*.35;return[cx+Math.cos(a)*f.r*R,cy+f.y*R*1.1+Math.sin(a)*f.r*R*.28,Math.sin(a)]});
    prj.forEach((p,i)=>{const on=(Math.sin(t*.01+fac[i].ph)+1)/2;
      x.strokeStyle=`rgba(35,80,200,${.05+on*.14})`;x.lineWidth=1;x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(cx,cy);x.stroke();
      x.fillStyle=`rgba(35,80,200,${.3+on*.5})`;x.fillRect(p[0]-2.5,p[1]-2.5,5,5);
      if(on>.92){x.strokeStyle='rgba(35,80,200,.5)';x.strokeRect(p[0]-6,p[1]-6,12,12)}});
    for(const p of pts){const X=p[0]*cr-p[2]*sr,Z=p[0]*sr+p[2]*cr;const s=(Z+1.6)/2.6;x.fillStyle=`rgba(13,20,36,${.1+s*.5})`;const r=.6+s*1.3;x.beginPath();x.arc(cx+X*R,cy+p[1]*R,r,0,7);x.fill()}
    t++;if(!reduce&&document.body.contains(c))raf=requestAnimationFrame(draw)};
  draw();
}

  for(const [kws,msg] of GDB.deferred_kw||[])if(kws.some(k=>t.includes(k.toLowerCase())))notices.push(msg);
  // 機械・装置（草刈機・ロボット・電動台車など）: モーター・駆動・フレームを持つものは、板金・切削・制御基板・組立の工程で読む

    if(/電動|バッテリー|充電|電池|ドローン|ロボ|自走/.test(t)&&!hit.includes('electronics.low_power'))hit.push('electronics.low_power')}

  if(!hw)hit=hit.filter(c=>!['testing.animal_trial','mechanical.wearable_fit','testing.human_trial'].includes(c));
  if(hw)for(const c of ['electronics.pcb_design','electronics.firmware','electronics.low_power','mechanical.enclosure_design','manufacturing.rapid_proto','electronics.pcba','manufacturing.assembly'])if(!hit.includes(c))hit.push(c);
  if(hit.includes('electronics.wireless')&&!hit.includes('testing.radio_cert'))hit.push('testing.radio_cert');

  if(u==='yen_cm3')return L==='en'?'¥'+n(v)+'/cm³':L==='zh'?n(v)+'日元/cm³':n(v)+'円/cm³';
  if(L==='en')return '¥'+n(Math.round(v));

function estimate(codes,qty){const E=D.est;if(!E)return null;const fx=E.usdjpy;const o={rows:[],lo:0,hi:0,missing:[],skip:[],qty};

    <p class="muted" style="margin:0;font-size:14px">試作のあとに「ここを直したい」と思ったら、写真や測定結果を添えて相談できます。AIが内容を整理して、答えられる工場や専門家に届けます。見積の前でも相談できます。</p>
    <form class="form" id="cf">
      <label for="c-t">相談したいこと<select id="c-t">${TOPICS.map(t=>`<option>${t}</option>`).join('')}</select></label>
      <label for="c-b">いまの状況<textarea id="c-b" rows="4" placeholder="例：試作品を犬に付けたら、歩いているときだけ心拍が測れなかった"></textarea></label>
      <label for="c-mail"><span>メールアドレス<span class="req">必須</span></span><input id="c-mail" type="email" autocomplete="email" placeholder="返事をお送りします"></label>
      <label for="c-org"><span>会社名・お名前<span class="opt-t">任意</span></span><input id="c-org"></label>
      <div style="display:grid;gap:6px"><span style="font-size:13px;color:var(--mute)">写真・動画・測定データ<span class="opt-t">任意</span></span><div id="mediaBox" class="mbox"></div></div>
      <div class="blk"><h4>相談先</h4><div style="display:grid;gap:10px">
        ${name?`<label class="chk"><input type="checkbox" checked><span>${esc(name)}<small>担当している工程の技術担当者</small></span></label>`:''}
        ${EXPERTS.map((e,i)=>`<label class="chk"><input type="checkbox" ${!name&&!i?'checked':''}><span>${e[0]}の専門家<small>${e[1]}</small></span></label>`).join('')}
        <label class="chk"><input type="checkbox" checked><span>AIに任せる<small>内容を読んで、答えられそうな相手をAIが選びます</small></span></label>
      </div></div>
      <div class="empty"><b>回答の見せ方</b>専門家の回答は「専門家の意見」、AIの整理は「AI推定」と分けて表示します。設計の変更や追加の費用が出るときは、必ずあなたの確認を取ってから進めます。</div>
      <label class="chk"><input type="checkbox" id="c-agree"><span>${TERMS_URL?`<a href="${TERMS_URL}" target="_blank" rel="noopener">利用規約</a>と<a href="${PRIVACY_URL}" target="_blank" rel="noopener">プライバシーポリシー</a>`:'利用規約とプライバシーポリシー'}に同意します<span class="req">必須</span></span></label>
      <div class="ferr" id="cfErr" role="alert"></div>
      <button class="btn pri" type="submit" style="height:48px">相談を送る</button>
    </form>
    ${demo()?`<div class="blk"><h4>相談のやりとり ${mk('demo','記入例')}</h4>
      <div class="rev"><span class="muted" style="font-size:12px">あなた · 試作1回目のあと</span>歩いているときだけ心拍が取れません。データと装着写真を添付します。</div>
      <div class="rev"><span class="muted" style="font-size:12px">KATACHI AI · 相談の整理 ${mk('ai','AI推定')}</span>歩行時の欠測率 38%。センサーが首の後ろ側にずれている可能性があります。装着機構と計測の両方に関わるため、2社に同時に相談します。</div>
      <div class="rev"><span class="muted" style="font-size:12px">（架空）ノースバイタル研究所 · 技術担当</span>重心を下げてセンサーを喉側に固定すれば改善する見込みです。電極の形の変更は2週間・約8万円で対応できます。</div></div>`:''}`);
  renderMedia();
  $('#cf').onsubmit=async e=>{e.preventDefault();
    const miss=[];const m=$('#c-mail').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m))miss.push('メールアドレス');if(!$('#c-b').value.trim())miss.push('いまの状況');if(!$('#c-agree').checked)miss.push('利用規約とプライバシーポリシーへの同意');
    if(miss.length){$('#cfErr').innerHTML='<span>入力してください</span>: '+miss.map(x=>'<span>'+x+'</span>').join(', ');track('form_error',{reason:'consult_required',fields:miss.length});return}
    const tos=[...$$('#cf .chk input[type=checkbox]')].filter(i=>i.id!=='c-agree'&&i.checked).map(i=>i.closest('label').querySelector('span').childNodes[0].textContent.trim());
    const ups=upList(),upKey=ups.list.length?rkey():'';const cbtn=e.submitter||$('#cf button[type=submit]');cbtn.disabled=true;
    const ok=await sendForm({type:'consult',upload:upKey?{key:upKey,count:ups.list.length,bytes:ups.bytes}:undefined,fields:mediaVals(),files:S.files.map(f=>f.name),lang:window.KATACHI_LANG?window.KATACHI_LANG():'ja',idea:S.idea||R().idea,company:name||'',topic:$('#c-t').value,body:$('#c-b').value.trim(),email:m,org:$('#c-org').value.trim(),to:tos,page:location.href.split('#')[0]});
    cbtn.disabled=false;
    track('generate_lead',{type:'consult',sent:ok,topic:$('#c-t').selectedIndex,to_company:!!name,files:S.files.length});
    const upr=ok&&upKey?await uploadWithUI(upKey,ups):null;done('相談を受け付けました','<p class="muted" style="margin:0">担当者が内容を確認し、答えられる工場や専門家に届けます。返事はメールでお知らせします。</p>'+(lastSent?upNote(upr,ups):''))};
}
function done(t,body){
  $('#ov .sheet').innerHTML=`${head('Done',t)}${lastSent?'<div class="ok"><b>送信しました。</b><span class="muted" style="font-size:13.5px">確認のメールをお送りします。数分たっても届かないときは、迷惑メールのフォルダもご確認ください。このあとは次のように進みます。</span></div>':'<div class="ok"><b>このページからは送信されていません。</b><span class="muted" style="font-size:13.5px">katachi.shiokonbu.com から送ると、このあと次のように進みます。</span></div>'}${body}<button class="btn" data-x>結果に戻る</button>`;
  $$('#ov [data-x]').forEach(b=>b.onclick=closeSheet);
}

/* ---------- i18n: dictionary + AI translation for everything else ---------- */
const DICT=window.KATACHI_I18N, LI={en:0,zh:1};
const YEN=(n,m)=>{const v=parseFloat(String(n).replace(/,/g,''))*m;return '¥'+(v>=1e9?(v/1e9).toFixed(1).replace(/\.0$/,'')+'B':v>=1e6?(v/1e6).toFixed(1).replace(/\.0$/,'')+'M':v.toLocaleString('en'))};
const UNIT={en:{'年':n=>n,'人':n=>n+' people','万円':n=>YEN(n,1e4),'億円':n=>YEN(n,1e8),'工程':n=>n+' steps','社':n=>n+(n==='1'?' company':' companies'),'件':n=>n,'個〜':n=>n+'+ units','個':n=>n+(n==='1'?' unit':' units'),'週':n=>n+(n==='1'?' week':' weeks'),'字':n=>n+' chars'},zh:{'年':n=>n+'年','人':n=>n+'人','万円':n=>n+'万日元','億円':n=>n+'亿日元','工程':n=>n+'道工序','社':n=>n+'家','件':n=>n+'条','個〜':n=>n+'个起','個':n=>n+'个','週':n=>n+'周','字':n=>n+'字'}};
const KEYS=Object.keys(DICT).filter(k=>k.length>=4).sort((a,b)=>b.length-a.length);
const RE=new RegExp(KEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const NAMES=Object.keys(D.companies).sort((a,b)=>b.length-a.length);
const JA=/[\u3040-\u30ff\u3400-\u9fff]/, KANA=/[\u3040-\u30fa\u30fc-\u30ff]/;
let LANG='ja',explicit=false,MT={en:{},zh:{}},pending=new Set(),mtBusy=false,mtOff=false,sampleFn=undefined;
try{const st=JSON.parse(localStorage.getItem('katachi-lang')||'null');if(st){LANG=st.lang;explicit=true}}catch(e){}
if(!explicit){const nl=(navigator.language||'ja').toLowerCase();LANG=nl.startsWith('ja')?'ja':nl.startsWith('zh')?'zh':'en'}
try{MT=Object.assign(MT,JSON.parse(localStorage.getItem('katachi-mt')||'{}'))}catch(e){}
const stillJa=t=>LANG==='zh'?KANA.test(t):JA.test(t);
function tx(src){
  if(LANG==='ja'||!JA.test(src))return src;
  const s=src.trim();const L=LI[LANG];
  if(NAMES.includes(s))return src;
  if(DICT[s])return src.replace(s,DICT[s][L]);
  if(MT[LANG][s])return src.replace(s,MT[LANG][s]);
  const pm=s.match(/^(難所：|確かめ方：)(.+)$/);if(pm&&DICT[pm[1]]&&DICT[pm[2]])return src.replace(s,DICT[pm[1]][L]+DICT[pm[2]][L]);
  // short labels: translate token by token when every token is known
  const parts=src.split(/(\s*[·\/、]\s*|\s+|^[←→]\s*|^難所：|^確かめ方：)/);let ok=true;
  const tp=parts.map(t=>{if(!t||!JA.test(t))return t;const k=t.trim();if(DICT[k])return t.replace(k,DICT[k][L]);if(NAMES.includes(k))return t;
    const m=k.match(/^(\d[\d,.]*)(社|件|個〜|個|週|字|工程|年|人|万円|億円)$/);if(m)return UNIT[LANG][m[2]](m[1]);ok=false;return t});
  if(ok)return tp.join('');
  // longer text: replace known phrases (4+ chars) around company names
  const keep=[];let w=src;
  for(const n of NAMES)if(w.includes(n)){w=w.split(n).join('\u0000'+keep.length+'\u0001');keep.push(n)}
  w=w.replace(RE,m=>DICT[m][L]).replace(/(\d[\d,]*)\s*(社|件|個〜|個|週|字)/g,(m,n,u)=>UNIT[LANG][u](n));
  const plain=w.replace(/\u0000\d+\u0001/g,'');
  if(stillJa(plain)){if(s.length<1500)pending.add(s);return src}
  return w.replace(/\u0000(\d+)\u0001/g,(m,i)=>keep[+i]);
}
function skip(n){const p=n.parentElement;return !p||p.closest('script,style,textarea,[translate="no"]')}
function translateTree(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(skip(n))continue;if(n.__src===undefined)n.__src=n.nodeValue;const v=tx(n.__src);if(n.nodeValue!==v)n.nodeValue=v}
  const els=root.querySelectorAll?root.querySelectorAll('[placeholder],[aria-label],[title]'):[];
  for(const el of els){if(el.closest('[translate="no"]'))continue;el.__a=el.__a||{};for(const a of ['placeholder','aria-label','title']){if(!el.hasAttribute(a))continue;if(el.__a[a]===undefined)el.__a[a]=el.getAttribute(a);const v=tx(el.__a[a]);if(el.getAttribute(a)!==v)el.setAttribute(a,v)}}
  scheduleMT();
}
let tq=0;new MutationObserver(()=>{if(tq)return;tq=requestAnimationFrame(()=>{tq=0;translateTree(document.body)})}).observe(document.body,{childList:true,subtree:true});
function mtUI(){const el=$('#mt');if(!el)return;
  if(LANG==='ja'||mtOff||!sampleFn){el.innerHTML='';return}
  if(mtBusy){el.innerHTML='<span class="mtstat"><i></i><span>'+(LANG==='en'?'Translating…':'翻译中…')+'</span></span>';return}
  el.innerHTML=pending.size&&!explicit?'<button class="mtbtn" id="mtGo">'+(LANG==='en'?'Translate all':'全部翻译')+'</button>':'';
  $('#mtGo')&&($('#mtGo').onclick=()=>{explicit=true;scheduleMT()})}
let mtT=0;
function scheduleMT(){mtUI();if(LANG==='ja'||mtOff||!explicit||!pending.size||mtBusy)return;clearTimeout(mtT);mtT=setTimeout(runMT,250)}
async function runMT(){
  if(sampleFn===undefined||!sampleFn){mtUI();return}
  const lang=LANG;const batch=[...pending].filter(s=>!MT[lang][s]).slice(0,40);pending=new Set([...pending].filter(s=>!batch.includes(s)));
  if(!batch.length)return;mtBusy=true;mtUI();
  try{
    const out=await sampleFn.json(`Translate each Japanese string below into ${lang==='en'?'natural English':'Simplified Chinese'} for a manufacturing matchmaking website (users who want products made, and factories). Keep company names, product names, model numbers, URLs and units unchanged. Keep it concise. Reply with only a JSON object whose keys are the input strings exactly as given and whose values are the translations.\n\n`+JSON.stringify(batch),{modelTier:'quick'});
    if(out&&typeof out==='object')for(const k of batch)if(typeof out[k]==='string')MT[lang][k]=out[k];
    try{localStorage.setItem('katachi-mt',JSON.stringify(MT))}catch(e){}
  }catch(e){if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code))mtOff=true}
  mtBusy=false;translateTree(document.body);mtUI();if(pending.size&&!mtOff)scheduleMT();
}
function setLang(l,byUser){const was=LANG;LANG=l;if(byUser&&was!==l)setTimeout(laiCheck,0);if(byUser){explicit=true;try{localStorage.setItem('katachi-lang',JSON.stringify({lang:l}))}catch(e){}}
  document.documentElement.lang=l==='zh'?'zh-Hans':l;$$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));pending.clear();refreshNums();translateTree(document.body)}
$$('[data-lang]').forEach(b=>b.onclick=()=>{track('lang_change',{to:b.dataset.lang,from:LANG});setLang(b.dataset.lang,true)});
(async()=>{try{sampleFn=window.claude?await window.claude.use('sample'):null}catch(e){sampleFn=null}scheduleMT()})();
window.KATACHI_LANG=()=>LANG;

if(!ideaFromUrl()){if(/^#(match|co)$/.test(location.hash)&&!S.idea)loadFlow();route()}
setLang(LANG,false);laiCheck();
})();
</script>
